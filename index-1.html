<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBD Banking</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f7f3;
      color: #173c2b;
    }

    header {
      background: #087443;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 440px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 24px;
      margin-bottom: 18px;
      border-radius: 16px;
      box-shadow: 0 4px 15px #00000010;
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ccd8d0;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #087443;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #e4f1e9;
      color: #087443;
    }

    .balance {
      background: #087443;
      color: white;
      padding: 24px;
      border-radius: 14px;
    }

    .amount {
      font-size: 30px;
      font-weight: bold;
      margin-top: 12px;
    }

    .hidden {
      display: none;
    }

    #message {
      margin-top: 15px;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .muted {
      color: #63756a;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <header>
    <h1>SBD Banking</h1>
    <p>Your banking dashboard</p>
  </header>

  <main class="container">

    <section id="authSection" class="card">
      <h2>Welcome</h2>
      <p>Create an account or log in to continue.</p>

      <form id="authForm">
        <input
          id="fullName"
          type="text"
          placeholder="Full name (for registration)"
          autocomplete="name"
        >

        <input
          id="email"
          type="email"
          placeholder="Email address"
          autocomplete="email"
          required
        >

        <input
          id="password"
          type="password"
          placeholder="Password (at least 6 characters)"
          autocomplete="current-password"
          minlength="6"
          required
        >

        <button type="button" id="signupBtn">
          Create Account
        </button>

        <button type="submit" id="loginBtn" class="secondary">
          Log In
        </button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section id="dashboard" class="hidden">
      <div class="card">
        <h2>Welcome, <span id="customerName">Customer</span></h2>
        <p id="customerEmail" class="muted"></p>

        <div class="balance">
          <div>Wallet Balance</div>
          <div class="amount" id="balance">₦0.00</div>
          <p>Nigerian Naira (NGN)</p>
        </div>

        <p id="walletMessage" role="status"></p>

        <button id="refreshBtn">Refresh Balance</button>
        <button id="logoutBtn" class="secondary">Log Out</button>
      </div>
    </section>

  </main>

  <script>
    const SUPABASE_URL =
      "https://lxbzslddcaxzijuefovc.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_FmBYWUxJUBL1uY2lZPgdog_I7S1gClb";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const authSection = document.getElementById("authSection");
    const dashboard = document.getElementById("dashboard");
    const message = document.getElementById("message");

    let currentUser = null;

    function showMessage(text) {
      message.textContent = text;
    }

    function formatNaira(amount) {
      return "₦" + Number(amount).toLocaleString("en-NG", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    async function loadWallet(user) {
      const walletMessage = document.getElementById("walletMessage");
      const balance = document.getElementById("balance");

      walletMessage.textContent = "Loading wallet...";
      balance.textContent = "Loading...";

      const { data, error } = await db
        .from("wallets")
        .select("balance, currency")
        .eq("user_id", user.id)
        .maybeSingle();

      if (error) {
        balance.textContent = "Unavailable";
        walletMessage.textContent =
          "Could not load your wallet. Please try again.";
        console.error("Wallet error:", error);
        return;
      }

      if (!data) {
        balance.textContent = "Unavailable";
        walletMessage.textContent =
          "No wallet was found for this account.";
        return;
      }

      balance.textContent = formatNaira(data.balance);
      walletMessage.textContent =
        "Currency: " + data.currency;
    }

    async function showDashboard(user) {
      currentUser = user;

      authSection.classList.add("hidden");
      dashboard.classList.remove("hidden");

      document.getElementById("customerEmail").textContent =
        user.email || "";

      const { data: profile } = await db
        .from("profiles")
        .select("full_name")
        .eq("id", user.id)
        .maybeSingle();

      document.getElementById("customerName").textContent =
        profile?.full_name ||
        user.user_metadata?.full_name ||
        "Customer";

      await loadWallet(user);
    }

    function showLogin() {
      currentUser = null;
      dashboard.classList.add("hidden");
      authSection.classList.remove("hidden");
    }

    document.getElementById("signupBtn").addEventListener(
      "click",
      async () => {
        const fullName =
          document.getElementById("fullName").value.trim();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        if (!fullName) {
          showMessage("Please enter your full name.");
          return;
        }

        showMessage("Creating your account...");

        const { data, error } = await db.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo:
              "https://bigsamswi2-coder.github.io/SBD-banking-/",
            data: {
              full_name: fullName
            }
          }
        });

        if (error) {
          showMessage(error.message);
          return;
        }

        if (data.session) {
          await showDashboard(data.session.user);
        } else {
          showMessage(
            "Account request received. Check your email to confirm " +
            "your account, then log in."
          );
        }
      }
    );

    document.getElementById("authForm").addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        showMessage("Logging in...");

        const { data, error } = await db.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          showMessage(error.message);
          return;
        }

        showMessage("");
        await showDashboard(data.user);
      }
    );

    document.getElementById("refreshBtn").addEventListener(
      "click",
      async () => {
        if (currentUser) {
          await loadWallet(currentUser);
        }
      }
    );

    document.getElementById("logoutBtn").addEventListener(
      "click",
      async () => {
        const { error } = await db.auth.signOut();

        if (error) {
          document.getElementById("walletMessage").textContent =
            "Could not log out. Please try again.";
          return;
        }

        showLogin();
        showMessage("You have logged out.");
      }
    );

    async function startApp() {
      const { data, error } = await db.auth.getSession();

      if (error) {
        showMessage("Could not check your login session.");
        return;
      }

      if (data.session) {
        await showDashboard(data.session.user);
      }
    }

    db.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_OUT") {
        showLogin();
      }
    });

    startApp();
  </script>
</body>
</html>
